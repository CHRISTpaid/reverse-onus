[project]
name = "suno-clone"
version = "0.1.0"
description = "Open-source Suno-style song generator: lyrics, style tags, song structure, extend, cover, replace section, stems"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2.6", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
suno-clone = "suno_clone.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["suno_clone*"]
